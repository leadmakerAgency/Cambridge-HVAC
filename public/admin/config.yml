# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: leadmakerAgency/Cambridge-HVAC
  branch: main

media_folder: public/images/blog
public_folder: /images/blog

collections:
  - name: blog
    label: Blog
    label_singular: Post
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "URL path after /blog/, e.g. wall-mounted-vs-multi-split" }
      - { label: Date, name: date, widget: datetime, time_format: false }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Hero image, name: image, widget: image, required: false }
      - { label: Image alt text, name: imageAlt, widget: string, required: false }
      - { label: SEO title, name: seoTitle, widget: string, required: false }
      - { label: SEO description, name: seoDescription, widget: text, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }
